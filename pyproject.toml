[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-mcp-server"
version = "0.1.0"
description = "Production MCP server with governed tool access, permission enforcement, and audit trails"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
